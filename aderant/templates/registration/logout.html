<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - Gestion des Adhérents</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logout-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logout-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 40px 20px;
        }
        
        .logout-body {
            padding: 40px;
        }
        
        .btn-logout {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .btn-cancel {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <!-- Header -->
        <div class="logout-header">
            <i class="fas fa-sign-out-alt fa-3x mb-3"></i>
            <h2 class="mb-1">Déconnexion</h2>
            <p class="mb-0 opacity-75">Êtes-vous sûr de vouloir vous déconnecter ?</p>
        </div>
        
        <!-- Body -->
        <div class="logout-body">
            <!-- Messages -->
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
            <div class="mb-4">
                <i class="fas fa-question-circle fa-2x text-warning mb-3"></i>
                <p class="mb-3">Vous serez redirigé vers la page de connexion.</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'dashboard' %}" class="btn btn-cancel text-white">
                        <i class="fas fa-arrow-left me-2"></i>
                        Annuler
                    </a>
                    <button type="submit" class="btn btn-logout text-white">
                        <i class="fas fa-sign-out-alt me-2"></i>
                        Se déconnecter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
